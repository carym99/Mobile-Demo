name: Mobile Android Test (Reusable)

on:
  workflow_call:
    inputs:
      test-suite:
        description: Cucumber suite to run (smoke or regression)
        required: true
        type: string
      job-timeout-minutes:
        description: Job timeout in minutes
        required: false
        type: number
        default: 45
      artifact-prefix:
        description: Prefix for uploaded artifact names
        required: false
        type: string
        default: mobile
      spec-retries:
        description: WebdriverIO spec-file retries (0 for regression, 1 for smoke)
        required: false
        type: number
        default: 0

jobs:
  android-tests:
    name: Android E2E (${{ inputs.test-suite }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    env:
      APPIUM_HOME: ${{ github.workspace }}
      CI: true
      CI_SPEC_RETRIES: ${{ inputs.spec-retries }}
      APP_LAUNCH_TIMEOUT: '120000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install project dependencies
        run: npm ci

      - name: Install Appium UiAutomator2 driver
        run: |
          npm run appium:install-driver || npx appium driver update uiautomator2

      - name: Verify Appium installation
        run: |
          npx appium --version
          npx appium driver list --installed

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run ${{ inputs.test-suite }} suite on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run-android-tests.sh ${{ inputs.test-suite }}

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d reports/allure-results ] && [ "$(ls -A reports/allure-results 2>/dev/null)" ]; then
            npm run allure:generate
          else
            echo "No Allure results found — skipping report generation"
          fi

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-allure-results
          path: reports/allure-results
          if-no-files-found: warn

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-allure-report
          path: reports/allure-report
          if-no-files-found: warn

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-logs
          path: reports/logs
          if-no-files-found: warn
